<svg xmlns="http://www.w3.org/2000/svg" width="960" height="510" viewBox="0 0 960 510" role="img" aria-labelledby="title desc"><title id="title">Architecture simplifiée du Starter WordPress ComKani</title><desc id="desc">La configuration et les composants passent par les outils de compilation pour produire les ressources utilisées avec le thème et ComKani Core dans WordPress.</desc><rect width="960" height="510" rx="20" fill="#f7f8fc"/><text x="45" y="58" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#152044">Architecture du Starter WordPress ComKani</text><text x="45" y="91" font-family="Arial,sans-serif" font-size="15" fill="#475569">Distinguer les sources, les outils et les fichiers qui fonctionnent sur le serveur</text><rect x="45" y="120" width="260" height="250" rx="14" fill="white" stroke="#cbd5e1"/><text x="65" y="156" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#10205a">Sources</text><text x="65" y="195" font-family="monospace" font-size="16" fill="#334155">config/src/</text><text x="65" y="233" font-family="monospace" font-size="16" fill="#334155">components/</text><text x="65" y="271" font-family="monospace" font-size="16" fill="#334155">resources/scss/</text><text x="65" y="309" font-family="monospace" font-size="16" fill="#334155">resources/ts/</text><path d="M310 245 L350 245" stroke="#274bd8" stroke-width="4"/><path d="M340 237 L352 245 L340 253" fill="none" stroke="#274bd8" stroke-width="4"/><rect x="355" y="175" width="220" height="140" rx="14" fill="#e5eaff" stroke="#6f86e8"/><text x="380" y="217" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#10205a">Outils locaux</text><text x="380" y="251" font-family="Arial,sans-serif" font-size="16" fill="#334155">Scripts + Vite</text><text x="380" y="277" font-family="Arial,sans-serif" font-size="16" fill="#334155">Génération + contrôles</text><path d="M580 245 L620 245" stroke="#274bd8" stroke-width="4"/><path d="M610 237 L622 245 L610 253" fill="none" stroke="#274bd8" stroke-width="4"/><rect x="625" y="120" width="290" height="250" rx="14" fill="white" stroke="#cbd5e1"/><text x="647" y="156" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#10205a">Site WordPress</text><text x="647" y="201" font-family="Arial,sans-serif" font-size="16" fill="#334155">Thème PHP</text><text x="647" y="236" font-family="Arial,sans-serif" font-size="16" fill="#334155">ComKani Core</text><text x="647" y="271" font-family="Arial,sans-serif" font-size="16" fill="#334155">CSS et JavaScript compilés</text><text x="647" y="306" font-family="Arial,sans-serif" font-size="16" fill="#334155">Base de données</text><text x="45" y="428" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#10205a">À retenir</text><text x="45" y="455" font-family="Arial,sans-serif" font-size="15" fill="#334155">Node.js et Vite servent à construire. Ils ne sont pas requis pour exécuter le site compilé en production.</text></svg>